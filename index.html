    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Currency Converter</title>
        <link href="style.css" rel="stylesheet" />
        <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
            <p>Enter Amount</p>
            <input id="inputBox" value="1" type="text" />
            </div>
            <div class="dropdown">
            <div class="from">
                <p>From</p>
                <div class="select-container">
                <img class="fromImage" src="https://flagsapi.com/US/flat/64.png" />
                <select class="from" name="from">
                    <option value="USD" selected>USA</option>
                </select>
                </div>
            </div>
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div class="to">
                <p>To</p>
                <div class="select-container">
                <img class="toImage" src="https://flagsapi.com/IN/flat/64.png" />
                <select class="to" name="to"> <option value="INR">IN</option></select>
                </div>
            </div>
            </div>
            <div class="msg">1USD = 96.63INR</div>
            <button class="exchange-rate">Get Exchange Rate</button>
        </form>
        </div>
        <script src="app.js"></script>
        <script src="script.js"></script>
    </body>
    </html>
